<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Deface By Repp76">
  <title>Repp76 | Defacement</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080808;
      --surface: #101010;
      --surface-2: #141111;
      --line: rgba(255,255,255,.105);
      --text: #f3f1f1;
      --muted: #a19a9a;
      --red: #e3343e;
      --red-soft: #ff5963;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: max(18px, env(safe-area-inset-top)) 20px max(18px, env(safe-area-inset-bottom));
      background:
        radial-gradient(ellipse at 50% 38%, rgba(125, 15, 22, .12), transparent 52%),
        #080808;
      color: var(--text);
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .13;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 82%);
    }
    .page {
      width: min(100%, 720px);
      min-height: calc(100svh - max(18px, env(safe-area-inset-top)) - max(18px, env(safe-area-inset-bottom)));
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 0 16px;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-mark {
      width: 36px; height: 36px; flex: 0 0 36px;
      display: grid; place-items: center;
      border: 1px solid rgba(227,52,62,.48);
      border-radius: 9px;
      background: linear-gradient(145deg, rgba(227,52,62,.15), rgba(227,52,62,.025));
    }
    .brand-mark svg { width: 22px; height: 22px; }
    .brand-name { font-size: 15px; font-weight: 760; letter-spacing: -.04em; }
    .brand-caption {
      margin-top: 3px; color: #928787; font-size: 9px;
      font-weight: 650; letter-spacing: .15em; text-transform: uppercase;
    }
    .status {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 9px; border: 1px solid var(--line); border-radius: 999px;
      color: #b9b0b0; font-size: 9px; font-weight: 650;
      letter-spacing: .075em; white-space: nowrap;
    }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--red); box-shadow: 0 0 9px rgba(227,52,62,.65);
    }
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(32px, 6vh, 58px) 0;
      text-align: center;
    }
    .eyebrow {
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      margin-bottom: 20px; color: var(--red-soft);
      font-size: 10px; font-weight: 750; letter-spacing: .2em; text-transform: uppercase;
    }
    .eyebrow::before, .eyebrow::after {
      content: ""; width: 18px; height: 1px; background: currentColor; opacity: .7;
    }
    h1 {
      margin: 0; font-size: clamp(37px, 8.4vw, 68px);
      line-height: .99; font-weight: 820; letter-spacing: -.075em;
    }
    h1 .accent {
      display: block; margin-top: 8px; color: var(--red);
      text-shadow: 0 0 34px rgba(227,52,62,.14);
    }
    .subtitle {
      max-width: 490px; margin: 19px auto 0; color: #aaa2a2;
      font-size: clamp(13px, 2.8vw, 15px); line-height: 1.75;
    }
    .divider {
      width: 44px; height: 2px; margin: 25px auto;
      border-radius: 2px; background: var(--red);
    }
    .message {
      width: min(100%, 520px); margin: 0 auto; padding: 18px 19px;
      text-align: left; border: 1px solid var(--line); border-radius: 12px;
      background: linear-gradient(135deg, rgba(22,18,18,.94), rgba(13,13,13,.94));
    }
    .message-label {
      display: flex; align-items: center; gap: 8px; color: #ddd5d5;
      font-size: 10px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase;
    }
    .message-label svg { width: 15px; height: 15px; color: var(--red-soft); flex: 0 0 auto; }
    .message p { margin: 10px 0 0; color: #a69d9d; font-size: 12px; line-height: 1.75; }
    .contact {
      align-self: center; display: inline-flex; align-items: center; gap: 12px;
      max-width: 100%; margin-top: 24px; padding: 11px 15px;
      color: var(--text); text-decoration: none;
      border: 1px solid rgba(227,52,62,.36); border-radius: 11px;
      background: rgba(227,52,62,.055);
      transition: border-color .18s ease, background .18s ease;
    }
    .contact:hover { border-color: rgba(227,52,62,.7); background: rgba(227,52,62,.1); }
    .telegram-icon {
      display: grid; place-items: center; width: 35px; height: 35px; flex: 0 0 35px;
      border-radius: 9px; color: #ffe5e6; background: rgba(227,52,62,.15);
    }
    .telegram-icon svg { width: 21px; height: 21px; }
    .contact-copy { text-align: left; }
    .contact-label {
      display: block; margin-bottom: 4px; color: #9e9292;
      font-size: 9px; font-weight: 750; letter-spacing: .13em;
    }
    .contact-handle { display: block; font-size: 13px; font-weight: 700; }
    .contact-arrow { margin-left: 8px; color: var(--red-soft); font-size: 17px; }
    .footer {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 15px 0 2px; border-top: 1px solid var(--line);
      color: #756d6d; font-size: 9px; letter-spacing: .065em; text-transform: uppercase;
    }
    .footer strong { color: #bcb3b3; font-weight: 700; }
    .footer-note { text-align: right; }
    @media (max-width: 480px) {
      body { padding-left: 16px; padding-right: 16px; }
      .topline { padding-bottom: 13px; }
      .status { font-size: 8px; padding: 7px 8px; letter-spacing: .045em; }
      .content { padding: 30px 0; }
      .eyebrow { margin-bottom: 17px; font-size: 9px; letter-spacing: .16em; }
      .subtitle { margin-top: 16px; }
      .divider { margin: 20px auto; }
      .message { padding: 16px; }
      .footer { font-size: 8px; }
    }
    @media (max-height: 760px) {
      .content { padding-top: 22px; padding-bottom: 22px; }
      .eyebrow { margin-bottom: 14px; }
      .subtitle { margin-top: 13px; }
      .divider { margin: 17px auto; }
      .contact { margin-top: 17px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
